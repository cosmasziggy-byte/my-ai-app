<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horror AI Generator</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #ff3333; margin-bottom: 20px; }
    textarea {
      width: 90%;
      max-width: 500px;
      height: 100px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      margin-top: 15px;
      padding: 12px 24px;
      background: #b30000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #555; }
    #output {
      margin-top: 25px;
      width: 90%;
      max-width: 500px;
      white-space: pre-wrap;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #b30000;
      min-height: 50px;
    }
  </style>
</head>
<body>

  <h1>Horror AI Story Generator</h1>
  <textarea id="prompt" placeholder="Enter a creepy prompt..."></textarea>
  <button id="genBtn" onclick="generateStory()">Generate Story</button>

  <div id="output">Your scary story will appear here...</div>

  <script>
    async function generateStory() {
      const promptInput = document.getElementById('prompt').value;
      const outputDiv = document.getElementById('output');
      const btn = document.getElementById('genBtn');

      if (!promptInput.trim()) {
        outputDiv.innerText = "Please enter a prompt first!";
        return;
      }

      outputDiv.innerText = "Generating darkness...";
      btn.disabled = true;

      try {
        const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            inputs: `Write a short horror story about: ${promptInput}`,
            parameters: { max_new_tokens: 250 }
          })
        });

        const result = await response.json();
        
        if (result.error) {
          outputDiv.innerText = "Error: " + result.error;
        } else if (Array.isArray(result) && result[0]?.generated_text) {
          outputDiv.innerText = result[0].generated_text;
        } else {
          outputDiv.innerText = JSON.stringify(result, null, 2);
        }
      } catch (err) {
        outputDiv.innerText = "Failed to fetch response: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
                                 </html>
